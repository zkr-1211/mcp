# CD 自动化部署 - 执行步骤定义
# 本文件定义了 CD skill 的标准执行流程,供 AI 严格遵循

version: "1.0.0"
name: "cd-deployment-steps"

# ============================================
# 全局约束（所有步骤必须遵守）
# ============================================
global_constraints:
  - "必须完整阅读本文件所有内容后再执行"
  - "必须严格按照步骤顺序执行,严禁跳过任何步骤"
  - "仅执行本文件中定义的操作,严禁执行其他未指定的操作"
  - "每一步完成后必须验证结果,确认成功后再进行下一步"
  - "如遇错误必须立即停止执行并报告,严禁擅自绕过或忽略错误"
  - "不要假设任何配置或状态,必须通过工具调用来确认"
  - "多环境部署时必须按顺序逐个执行,严禁并行处理"
  - "所有涉及用户交互的操作必须暂停执行,等待用户确认后才能继续"

# ============================================
# 参数传递原则（CRITICAL）
# ============================================
parameter_rules:
  critical: true
  rules:
    - "✅ 只传递 config.yaml 中 jenkins.{ENV}.params 明确配置的参数"
    - "✅ 未配置的参数 → 绝对不传递,让 Jenkins 使用其 XML 配置的默认值"
    - "❌ 严禁假设需要传什么参数,严禁传递配置中不存在的参数"
    - "❌ 当 is_current_branch: false 时,严禁传入任何分支相关参数(如 branch_name)"
  
  examples:
    correct:
      config: |
        jenkins:
          is_current_branch: false
          'dev':
            fullname: "dev-platforms-advertiser"
            params:
              BUILD_NAME: "build:dev"
      result: '{"BUILD_NAME": "build:dev"}'
      note: "✅ 正确 - 只传配置的参数"
    
    wrong:
      - result: '{"branch_name": "develop", "BUILD_NAME": "build:dev"}'
        note: "❌ 错误 - 不要传 branch_name"
      - result: '{"BUILD_NAME": "build:dev", "APP_ENV": "测试"}'
        note: "❌ 错误 - 不要传其他未配置参数"

# ============================================
# 执行步骤
# ============================================
steps:
  
  # ----------------------------------------
  # 步骤 0: 前置检查 - Jenkins MCP 可用性验证
  # ----------------------------------------
  - step: 0
    name: "jenkins_mcp_availability_check"
    description: "验证 Jenkins MCP 是否可用"
    actions:
      - name: "确定 MCP 名称"
        description: "扫描 config.yaml 中的所有 Jenkins 配置块,根据环境参数找到对应的配置块"
      
      - name: "调用只读工具检查"
        tool: "mcp_{mcp_name}_get_all_items"
        params:
          random_string: "check"
      
      - name: "判断结果"
        conditions:
          - condition: "返回 tool not found 或 not found MCPHost 或 50001 错误码"
            action: "立即停止,输出错误信息"
            error_message: |
              ❌ Jenkins MCP 不可用,无法执行部署流程
              请在 MCP 配置中启用 Jenkins MCP 后重试:
              编辑器设置 → MCP → 启用 Jenkins
          
          - condition: "返回其他任何结果(含 404、401、数据等)"
            action: "视为 MCP 可用,继续执行"

  # ----------------------------------------
  # 步骤 1: 获取部署信息
  # ----------------------------------------
  - step: 1
    name: "get_deployment_info"
    description: "解析环境参数、查找 Jenkins Job 配置"
    sub_steps:
      
      # 1.1 配置读取（三级优先级）
      - step: 1.1
        name: "config_reading"
        description: "按优先级读取配置"
        priority_order:
          - level: 1
            source: "项目根目录 config.yaml"
            rule: "若找到配置,直接使用,严禁要求用户确认,直接部署"
          
          - level: 2
            source: "Skill 目录下 template.yaml"
            rule: "若找到配置,直接使用,严禁要求用户确认,直接部署,严禁进入智能发现"
            note: "template.yaml 是预配置文件,不是智能发现"
          
          - level: 3
            source: "智能发现"
            rule: "只有当 config.yaml 和 template.yaml 都找不到配置时才执行"
            constraint: "智能发现必须用户确认"
      
      # 1.2 解析多环境参数
      - step: 1.2
        name: "parse_env_params"
        description: "将用户输入按逗号或空格分割,提取多个 ENV 值"
        examples:
          - input: "/cd dev-api,dev-admin branch:feature/xxx"
            output: "['dev-api', 'dev-admin']"
          - input: "/cd dev-api dev-admin"
            output: "['dev-api', 'dev-admin']"
      
      # 1.3 解析分支参数
      - step: 1.3
        name: "parse_branch_param"
        description: "提取分支参数"
        rules:
          - "若用户传入了 branch:xxx,提取指定分支名,跳过分支获取"
          - "若未指定分支,继续下一步"
      
      # 1.4 查找 Jenkins Job
      - step: 1.4
        name: "find_jenkins_job"
        description: "严格按顺序查找 Jenkins Job"
        search_order:
          - order: 1
            source: "config.yaml"
            action: "首先在此查找"
          
          - order: 2
            source: "template.yaml"
            action: "若 config.yaml 中不存在,必须在此查找"
          
          - order: 3
            source: "智能发现"
            action: "只有前两者都找不到时才进入"
            methods:
              - method: "精确查找"
                tool: "mcp_{mcp_name}_get_item"
                description: "对每个 Jenkins MCP 查询环境名称对应的 Job"
                on_success: |
                  1. 调用 mcp_{mcp_name}_get_item_config 获取 Job 配置
                  2. 必须暂停并等待用户确认
                  3. 用户确认后判断是否需要交互选择参数
              
              - method: "模糊查找"
                tool: "mcp_{mcp_name}_query_items"
                description: "遍历所有 Jenkins MCP 获取所有 Jobs,模糊匹配环境名称"
                on_match: "展示带描述的匹配列表,让用户选择"
      
      # 1.5 确定 MCP 名称
      - step: 1.5
        name: "determine_mcp_name"
        description: "根据配置块名称确定 MCP 名称"
        rule: "工具前缀格式: mcp_{配置块名称}_*"
        examples:
          - config_block: "jenkins"
            tool_prefix: "mcp_jenkins_*"
          - config_block: "jenkins-prod"
            tool_prefix: "mcp_jenkins_prod_*"
      
      # 1.6 读取全局配置
      - step: 1.6
        name: "read_global_config"
        description: "从 config.yaml 读取 is_current_branch 配置"
        rules:
          - key: "is_current_branch"
            default: false
            true_behavior: "用户未指定分支时,执行 git branch --show-current 获取当前分支"
            false_behavior: "用户未指定分支时,不执行 git 命令,直接使用 Jenkins Job 的固定分支"
      
      # 1.7 读取环境完整配置
      - step: 1.7
        name: "read_env_config"
        description: "读取每个环境的完整配置信息"
        fields:
          - field: "fullname"
            description: "Jenkins 任务全名"
          - field: "url"
            description: "Jenkins 构建页面 URL(可选)"
          - field: "params"
            description: "构建参数(支持占位符,可选)"
          - field: "select_options"
            description: "参数选项列表(可选,优先从 Jenkins 获取)"
      
      # 1.8 动态获取 Job 信息
      - step: 1.8
        name: "get_job_info"
        description: "调用 mcp_{mcp_name}_get_item 获取 Job 详细信息"
        tool: "mcp_{mcp_name}_get_item"
        extract: "url 字段作为构建页面链接"
      
      # 1.9 确定部署分支
      - step: 1.9
        name: "determine_branch"
        description: "确定要部署的分支"
        decision_tree:
          - condition: "用户指定了分支"
            action: "直接使用指定分支"
          
          - condition: "用户未指定分支,且 is_current_branch: true"
            action: "执行 git branch --show-current 获取当前分支"
          
          - condition: "用户未指定分支,且 is_current_branch: false"
            action: "完全跳过分支部署逻辑,不执行任何分支相关命令"
            note: "使用 Jenkins Job 绑定的固定分支"
      
      # 1.10 分支占位符替换
      - step: 1.10
        name: "branch_placeholder_replacement"
        description: "处理 params 中的 {branch} 占位符"
        rules:
          - condition: "获取到分支"
            action: "替换为确定的分支名"
          - condition: "未获取分支(is_current_branch: false 或用户未指定)"
            action: "移除包含 {branch} 占位符的参数项"

  # ----------------------------------------
  # 步骤 2: 参数处理与交互
  # ----------------------------------------
  - step: 2
    name: "parameter_processing"
    description: "处理 Jenkins 构建参数"
    logic:
      - condition: "config.yaml 中未配置 params 或 params 为空对象 {}"
        action: "使用 buildWithParameters 模式触发构建,传递空对象 {}"
        result: "Jenkins 将使用所有参数的默认值进行构建"
        note: "✅ 未配置任何参数时,直接使用 Jenkins 默认值"
      
      - condition: "config.yaml 中配置了 params"
        action: "遍历 jenkins.{ENV}.params 中的每个参数"
        sub_rules:
          - condition: "参数值已填写(非空字符串、非空数组、非空对象)"
            action: "根据参数值类型处理"
            value_types:
              - type: "数组(如 ['test', 'pre'])"
                action: "使用同一个 Jenkins Job,依次部署多次,每次传递数组中的一个值"
                example: |
                  ENV: ['test', 'pre'] → 
                  第 1 次部署: 调用 Jenkins Job,传递 {ENV: 'test'}
                  第 2 次部署: 调用 Jenkins Job,传递 {ENV: 'pre'}
                  
                  任何参数的数组都这样处理:
                  DEPLOY_ENV: ['dev', 'test', 'prod'] → 部署 3 次
                note: "数组表示对同一个 Job 进行多次部署,每次使用数组中的一个值"
              
              - type: "字符串(如 'test')"
                action: "部署一次,传递该值"
                example: "ENV: 'test' → 调用 Jenkins Job,传递 {ENV: 'test'}"
              
              - type: "其他类型(数字、对象等)"
                action: "直接作为 Jenkins 构建参数传递"
                example: "BUILD_NAME: 'build:dev' → 传递 {BUILD_NAME: 'build:dev'}"
          
          - condition: "参数值为空字符串 '' 或空数组 [] 或空对象 {}"
            action: "进入交互流程,让用户选择"
            note: "只有参数值为空时才询问用户"
    
    interaction_rules:
      - "全面暂停:一旦检测到任何需要交互的参数,立即暂停所有后续执行流程"
      - "等待用户输入:显示交互界面,等待用户完成选择并提交"
      - "用户确认后继续:只有收到用户明确的选择结果后,才能继续执行"
      - "严禁自动选择:绝对禁止在用户未输入的情况下自动选取任何选项"
    
    get_options_priority:
      - priority: 1
        source: "config.yaml 的 select_options"
        rule: "如果找到,直接使用,严格按照原始值显示"
      
      - priority: 2
        source: "Jenkins Job 配置"
        tool: "mcp_{mcp_name}_get_item_config"
        parse: "hudson.model.ChoiceParameterDefinition 的 choices 列表"
        rule: "直接使用从 Jenkins XML 中解析出的原始选项值"
        on_failure: |
          ❌ 部署中止:参数 {参数名} 值为空,且无法从 Jenkins 获取可选值
          解决方案:
          - 在 config.yaml 的 jenkins.{ENV}.select_options 中手动配置选项列表
          - 或在 jenkins.{ENV}.params 中直接填写该参数值
    
    placeholder_replacement:
      - placeholder: "{branch}"
        replace_with: "部署分支"
      - placeholder: "{env}"
        replace_with: "当前环境"

  # ----------------------------------------
  # 步骤 3: 触发 Jenkins 构建
  # ----------------------------------------
  - step: 3
    name: "trigger_jenkins_build"
    description: "触发 Jenkins 构建"
    execution_mode: "顺序执行,严禁并行"
    
    multi_env_flow: |
      检查params配置 → 有值直接部署 / 空值才交互 → 完成
    
    multi_env_example: |
      场景A: config.yaml 中某参数为数组
        jenkins:
          'dev':
            fullname: "dev-platforms-advertiser"
            params:
              ENV: ['test', 'pre']
              BUILD_NAME: "build:dev"
        
        执行流程:
          → 读取 params.ENV = ['test', 'pre'] (数组)
          → 使用同一个 Jenkins Job (dev-platforms-advertiser) 依次部署:
            第 1 次: 传递参数 {ENV: 'test', BUILD_NAME: 'build:dev'}
            第 2 次: 传递参数 {ENV: 'pre', BUILD_NAME: 'build:dev'}
          → 不询问用户,直接依次部署
      
      场景B: config.yaml 中某参数为字符串
        jenkins:
          'dev':
            fullname: "dev-platforms-advertiser"
            params:
              ENV: 'test'
        
        执行流程:
          → 读取 params.ENV = 'test' (字符串)
          → 使用 Jenkins Job (dev-platforms-advertiser) 部署一次
          → 传递参数 {ENV: 'test'}
          → 不询问用户,直接部署
      
      场景C: config.yaml 中 ENV 参数为空
        jenkins:
          'dev':
            fullname: "dev-platforms-advertiser"
            params:
              ENV: []
        
        执行流程:
          → 读取 params.ENV = [] (空数组)
          → 进入交互流程,询问用户选择部署环境
          → 等待用户选择后继续
          → 触发构建
      
      场景D: config.yaml 中未配置 params
        jenkins:
          'dev':
            fullname: "dev-platforms-advertiser"
        
        执行流程:
          → 未配置 params
          → 使用 buildWithParameters + {} 触发构建
          → Jenkins 使用所有参数默认值
          → 部署完成
    
    rules:
      - "参数有值直接部署:只要 config.yaml 中 params 的参数值非空,直接传递给 Jenkins,不询问"
      - "参数为空才询问:只有参数值为空字符串、空数组或空对象时,才进入交互流程"
      - "未配置params时:使用 buildWithParameters + {} 触发,Jenkins 使用默认值"
    
    single_env_steps:
      - step: 3.1
        name: "输出部署进度"
        format: "🚀 开始第 {index}/{total} 个部署: {env}..."
      
      - step: 3.2
        name: "读取 params 配置"
        conditions:
          - condition: "未配置 params 或配置为 {}"
            action: "直接使用 buildWithParameters + 空对象 {} 触发构建"
            note: "使用 Jenkins 默认值,不进入交互"
          
          - condition: "配置了 params"
            action: "遍历参数,对空值参数进入交互流程"
      
      - step: 3.3
        name: "执行参数处理与交互"
        reference: "见步骤 2"
        constraint: "如果需要交互选择,必须暂停等待用户完成选择"
      
      - step: 3.4
        name: "调用 Jenkins 构建"
        tool: "mcp_{mcp_name}_build_item"
        params:
          fullname: "Jenkins 任务全名"
          build_type: "buildWithParameters (固定值)"
          params: "处理后的参数对象(只包含 config.yaml 中明确配置的参数)"
        note: "未配置的参数不传,使用 Jenkins 默认值"
      
      - step: 3.5
        name: "等待部署触发成功"
        action: "确认该环境部署触发成功后,再进入下一个环境"
    
    error_handling:
      branch_not_supported:
        condition: "错误信息包含分支相关关键字"
        action: |
          ⚠️ 部署失败:Jenkins Job 可能不支持分支参数传入
          
          当前配置尝试传入的分支参数:
          - {分支参数名}: {分支值}
          
          建议解决方案:
          - 如果 Job 已绑定固定分支:请在 config.yaml 的 jenkins.{ENV}.params 中移除分支参数
          - 如果参数名不正确:请修改 params 中的分支参数名与 Jenkins Job 一致
          - 检查 Jenkins 权限配置
        next: "停止执行,等待用户修改配置后重试"
      
      multi_env_failure:
        condition: "多环境批量部署时,某个环境部署失败"
        actions:
          - "输出失败环境的错误信息"
          - "继续部署剩余环境(默认继续)"
          - "最后汇总成功和失败的环境列表"

  # ----------------------------------------
  # 步骤 4: 输出结果
  # ----------------------------------------
  - step: 4
    name: "output_results"
    description: "输出部署结果汇总"
    format_requirement: "必须使用 Markdown 表格格式,严禁使用 plaintext 或列表格式"
    
    single_env_output: |
      ✅ 部署触发成功
      
      📋 部署信息:
      
      | 项目 | 值 |
      |------|-----|
      | 项目名称 | {project_name} |
      | 部署分支 | {branch} |
      | 目标环境 | {env} |
      | 队列 ID | {queue_id} |
      | 构建链接 | [点击查看构建进度]({build_url}) |
    
    multi_env_output: |
      ✅ 批量部署触发成功(共 {total} 个环境)
      
      📋 部署信息汇总:
      
      | 环境 | 项目名称 | 队列 ID | 构建链接 |
      |------|----------|---------|----------|
      | ✅ {env_1} | {project_name_1} | {queue_id_1} | [点击查看构建]({build_url_1}) |
      | ✅ {env_2} | {project_name_2} | {queue_id_2} | [点击查看构建]({build_url_2}) |
      | ✅ {env_3} | {project_name_3} | {queue_id_3} | [点击查看构建]({build_url_3}) |
      
      **分支策略**:使用 Jenkins Job 固定分支 / {branch}
