# yaml-language-server: $schema=
# 环境分支映射配置
# 支持多项目配置，每个项目可定义多个环境
projects:
  # 默认项目配置（当未匹配到具体项目时使用）
  default:
    environments:
      dev:
        personal_branch: "" 
        target_branch: "develop"
      test:
        personal_branch: ""
        target_branch: "test"
      uat:
        personal_branch: ""
        target_branch: "uat"

# 可选：MR 标题模板配置（覆盖默认模板）
templates:
  mr_title: "[AI] Auto: 合并 {source_branch} 到 {target_branch}"
  mr_description: |
    自动化合并请求
    - 源分支: {source_branch}
    - 目标分支: {target_branch}
    - 触发环境: {env}
    - 触发时间: {timestamp}

