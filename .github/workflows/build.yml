name: Build Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node24-macos-arm64
            output: postar-pipe-mcp-macos-arm64
          - os: windows-latest
            target: node24-win-x64
            output: postar-pipe-mcp-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx @yao-pkg/pkg dist/server.js -t ${{ matrix.target }} -o release/${{ matrix.output }} --compress Brotli --config package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: release/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release/
      
      # 打包为 zip 保留执行权限
      - name: Package binaries with permissions
        run: |
          cd release
          # macOS 文件
          if [ -f postar-pipe-mcp-macos-arm64 ]; then
            chmod +x postar-pipe-mcp-macos-arm64
            zip postar-pipe-mcp-macos-arm64.zip postar-pipe-mcp-macos-arm64
          fi
          # Windows 文件
          if [ -f postar-pipe-mcp-win-x64.exe ]; then
            zip postar-pipe-mcp-win-x64.zip postar-pipe-mcp-win-x64.exe
          fi
          ls -la
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.zip
            release/*.exe
          body: |
            ## 📦 安装方式
            
            ### 方式 1：通过 npm 安装（推荐 ✨）
            ```bash
            npm install postar-pipe-mcp
            ```
            自动下载并配置，无需手动处理权限问题。
            
            ### 方式 2：手动下载
            
            **macOS (Apple Silicon):**
            ```bash
            # 1. 下载 postar-pipe-mcp-macos-arm64.zip
            # 2. 解压
            unzip postar-pipe-mcp-macos-arm64.zip
            
            # 3. 添加执行权限（如需要）
            chmod +x postar-pipe-mcp-macos-arm64
            
            # 4. 验证
            ./postar-pipe-mcp-macos-arm64 --version
            ```
            
            **Windows:**
            ```powershell
            # 1. 下载 postar-pipe-mcp-win-x64.zip
            # 2. 解压
            Expand-Archive postar-pipe-mcp-win-x64.zip
            
            # 3. 运行
            .\postar-pipe-mcp-win-x64.exe --version
            ```
            
            > ⚠️ **macOS 用户注意**
            > 
            > 如果提示"无法打开"或"Apple 无法检查恶意软件"，请：
            > 1. 打开"系统偏好设置 > 安全性与隐私"
            > 2. 点击"仍要打开"
            > 3. 或在终端运行：`xattr -d com.apple.quarantine postar-pipe-mcp-macos-arm64`
            
            ## 🔧 配置 MCP Server
            
            在 `mcp.json` 中添加：
            ```json
            {
              "mcpServers": {
                "pipe-mcp": {
                  "command": "npx",
                  "args": ["postar-pipe-mcp"],
                  "env": {
                    "JENKINS_USER": "your_user",
                    "JENKINS_TOKEN": "your_token",
                    "GITLAB_TOKEN": "your_gitlab_token"
                  }
                }
              }
            }
            ```
          generate_release_notes: false

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public --provenance
