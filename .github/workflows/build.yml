name: Build Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: node24-macos-arm64
            output: postar-pipe-mcp-macos-arm64
          - os: macos-14
            target: node24-macos-x64
            output: postar-pipe-mcp-macos-x64
          - os: ubuntu-latest
            target: node24-linux-x64
            output: postar-pipe-mcp-linux-x64
          - os: windows-latest
            target: node24-win-x64
            output: postar-pipe-mcp-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx @yao-pkg/pkg . -t ${{ matrix.target }} -o release/${{ matrix.output }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: release/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
      - name: Upload to OSS
        env:
          # TODO: 在 GitHub Secrets 里配置以下四个变量
          # OSS_ACCESS_KEY_ID     => 阿里云 AccessKey ID
          # OSS_ACCESS_KEY_SECRET => 阿里云 AccessKey Secret
          # OSS_BUCKET            => Bucket 名称，如 my-bucket
          # OSS_REGION            => 地域，如 oss-cn-hangzhou
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          VERSION: ${{ github.ref_name }}
        run: |
          pip install oss2 --quiet
          python3 - <<EOF
          import oss2, os, glob

          auth = oss2.Auth(os.environ['OSS_ACCESS_KEY_ID'], os.environ['OSS_ACCESS_KEY_SECRET'])
          bucket = oss2.Bucket(auth, f"https://{os.environ['OSS_REGION']}.aliyuncs.com", os.environ['OSS_BUCKET'])
          version = os.environ['VERSION']

          for file in glob.glob('release/*'):
              filename = os.path.basename(file)
              key = f"postar-pipe-mcp/{version}/{filename}"
              print(f"Uploading {filename} => {key}")
              bucket.put_object_from_file(key, file)
              print(f"Done: {key}")
          EOF
      - name: Commit binaries back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/
          git diff --cached --quiet || git commit -m "chore: sync release binaries for ${{ github.ref_name }}"
          git push origin HEAD:main

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          # TODO: 在 GitHub Secrets 里配置 NPM_TOKEN
          # 去 https://www.npmjs.com/settings/<用户名>/tokens 创建 Automation Token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
